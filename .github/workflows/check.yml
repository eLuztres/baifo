name: Checks

# Vercel deploys every push by itself; this shows a red mark on the commit when types, lint or tests break.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest --silent
        # The tests expect Baifo's settings, which live in .env locally; made-up numbers, nobody is written to.
        env:
          NEXT_PUBLIC_SHOP_TIME_ZONE: Atlantic/Canary
          ADMIN_WHATSAPP_NUMBER: '34600000000'
          BIZUM_PHONE: 600 000 000
