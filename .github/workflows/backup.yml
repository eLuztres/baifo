name: Weekly backup

on:
  schedule:
    - cron: '0 3 * * 0' # Sundays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - run: scripts/backup.sh
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONFIG_BAIFO_TYPE: drive
          RCLONE_CONFIG_BAIFO_SCOPE: drive.file
          RCLONE_CONFIG_BAIFO_TOKEN: ${{ secrets.BACKUP_DRIVE_TOKEN }}
