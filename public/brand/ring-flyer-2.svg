<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60">
  <style>
    /* Two quick beats, then a long glide. The wings swing from the shoulder, each gull on its own rhythm, so the flock never beats in step. */
    @keyframes left { 0%,34%,100% { transform: rotate(0deg); } 8% { transform: rotate(-18deg); } 16% { transform: rotate(24deg); } 24% { transform: rotate(-14deg); } 30% { transform: rotate(8deg); } 58% { transform: rotate(-5deg); } 78% { transform: rotate(4deg); } }
    @keyframes right { 0%,34%,100% { transform: rotate(0deg); } 8% { transform: rotate(18deg); } 16% { transform: rotate(-24deg); } 24% { transform: rotate(14deg); } 30% { transform: rotate(-8deg); } 58% { transform: rotate(5deg); } 78% { transform: rotate(-4deg); } }
    .wing { transform-origin: 60px 30px; animation: 4.7s ease-in-out -2.1s infinite; }
    .left { animation-name: left; }
    .right { animation-name: right; }
  </style>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g class="wing left">
      <path d="M60 30 Q52 20 40 16 Q22 10 8 26" stroke="#1F2A2E" stroke-width="10"/>
      <path d="M60 31 Q52 22 40 18 Q22 12 10 25" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M8 26 Q13 19 20 16" stroke="#1F2A2E" stroke-width="9"/>
    </g>
    <g class="wing right">
      <path d="M60 30 Q68 20 80 16 Q98 10 112 26" stroke="#1F2A2E" stroke-width="10"/>
      <path d="M60 31 Q68 22 80 18 Q98 12 110 25" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M112 26 Q107 19 100 16" stroke="#1F2A2E" stroke-width="9"/>
    </g>
  </g>
  <ellipse cx="60" cy="31" rx="7" ry="5" fill="#FFFFFF" stroke="#1F2A2E" stroke-width="2.5"/>
  <path d="M66 31 L71 30" stroke="#F4B942" stroke-width="2.5" stroke-linecap="round"/>
</svg>
