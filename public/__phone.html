<!doctype html><meta charset="utf-8"><title>Phone check</title>
<style>body{margin:0;background:#333;display:flex;gap:24px;padding:16px}iframe{border:0;background:#fff;border-radius:12px}</style>
<iframe id="a" width="375" height="740"></iframe><iframe id="b" width="390" height="844"></iframe>
<script>
  // Temporary local check of small screens; only same-site paths.
  const path = new URLSearchParams(location.search).get('p') || '/';
  const safe = path.startsWith('/') && !path.startsWith('//') ? path : '/';
  document.getElementById('a').src = safe;
  document.getElementById('b').src = safe;
</script>
